<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ===== EDIT THESE ===== -->
<title>Save the Date — Ridhiman & Vijit</title>
<meta property="og:title" content="Save the Date — Ridhiman & Vijit">
<meta property="og:description" content="We're getting married! February 27th, 2027 — Panchkula, India.">
<meta name="theme-color" content="#c02a72">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    /* EDIT: colors */
    --navy:#3a3350;    /* headings & tagline */
    --mauve:#7c6a86;   /* date */
    --rose1:#d6297a; --rose2:#a81e63;  /* script name gradient */
    --btn:#b83f77;     /* filled button */
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:linear-gradient(165deg,#fdf5ef 0%,#fbeef0 55%,#f8e7ec 100%);
    color:var(--navy);
    font-family:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
    display:grid; place-items:center; min-height:100dvh; padding:2rem; text-align:center;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  .card{max-width:38rem; position:relative; z-index:3; padding:1rem; animation:rise 1s ease both}
  @keyframes rise{from{opacity:0; transform:translateY(14px)}to{opacity:1}}
  .tagline{font-style:italic; font-size:clamp(1.05rem,3.4vw,1.35rem); color:var(--navy); opacity:.85; line-height:1.6; margin-bottom:1.8rem}
  .eyebrow{font-size:clamp(1.1rem,3.6vw,1.5rem); letter-spacing:.18em; text-transform:uppercase; font-weight:500; line-height:1.5; color:var(--navy)}
  .names{font-family:"Great Vibes",cursive; font-weight:400; line-height:.92;
    font-size:clamp(3.8rem,15vw,6.6rem); margin:.6rem 0 .1rem;
    background:linear-gradient(92deg,var(--rose1),var(--rose2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .amp{font-style:italic; font-size:clamp(1.4rem,4vw,1.9rem); color:var(--mauve); margin:.1rem 0}
  .date{font-size:clamp(1.5rem,5vw,2.15rem); color:var(--mauve); line-height:1.35; font-weight:500}
  .date .day{display:block}
  .place{display:block; margin-top:.15rem}
  .foot{margin-top:1.4rem; font-size:.95rem; letter-spacing:.22em; text-transform:uppercase; color:var(--navy); opacity:.75}
  .actions{display:flex; flex-wrap:wrap; gap:.9rem; justify-content:center; margin-top:2rem}
  .cta{
    font-family:"Cormorant Garamond",serif; display:inline-block; padding:.7rem 1.7rem;
    border:1px solid #cf9ab4; border-radius:2rem; color:var(--navy);
    text-decoration:none; letter-spacing:.16em; text-transform:uppercase; font-size:.82rem; font-weight:600;
    transition:background .2s,color .2s,border-color .2s;
  }
  .cta:hover{background:#f3dbe4; border-color:#c98aa8}
  .cta.primary{background:var(--btn); color:#fff; border-color:var(--btn)}
  .cta.primary:hover{background:#9d2c60; border-color:#9d2c60; color:#fff}
  /* soft pastel corner sprays (injected procedurally, redrawn each load) */
  .corner{position:fixed; width:min(46vw,360px); aspect-ratio:1; z-index:1; pointer-events:none; opacity:.95;
    filter:blur(.25px) drop-shadow(0 1px 2px rgba(120,80,95,.14))}
  .tl{top:0; left:0}
  .tr{top:0; right:0; transform:scaleX(-1)}
  .bl{bottom:0; left:0; transform:scaleY(-1)}
  .br{bottom:0; right:0; transform:scale(-1)}
  @media (max-height:560px){
    .corner{display:none}
    body{place-items:start center; padding-block:1.5rem}
  }
</style>
</head>
<body>
  <svg id="defs" width="0" height="0" style="position:absolute" aria-hidden="true"><defs></defs></svg>

  <svg class="corner tl" viewBox="0 0 300 300" aria-hidden="true"></svg>
  <svg class="corner tr" viewBox="0 0 300 300" aria-hidden="true"></svg>
  <svg class="corner bl" viewBox="0 0 300 300" aria-hidden="true"></svg>
  <svg class="corner br" viewBox="0 0 300 300" aria-hidden="true"></svg>

  <main class="card">
    <p class="tagline">Circle the date in your heart and your calendar!<br>We can't imagine celebrating without you there.</p>
    <p class="eyebrow">Save the Date<br>for the wedding of</p>
    <!-- EDIT: names -->
    <h1 class="names">Ridhiman</h1>
    <p class="amp">and</p>
    <h1 class="names">Vijit</h1>
    <!-- EDIT: date + place -->
    <p class="date"><span class="day">Saturday</span>February 27th, 2027<span class="place">Panchkula, India</span></p>
    <p class="foot">Formal invite to follow</p>

    <div class="actions">
      <!-- EDIT the calendar link's dates (YYYYMMDD) & details -->
      <a class="cta" target="_blank" rel="noopener"
         href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Ridhiman%20%26%20Vijit%27s%20Wedding&dates=20270227/20270228&details=Save%20the%20date%21%20Formal%20invite%20to%20follow.&location=Panchkula%2C%20India">
        Add to calendar
      </a>
      <!-- EDIT: RSVP phone number (keep tel: and +country code) -->
      <a class="cta primary" href="tel:+919781274023">RSVP — Call us</a>
    </div>
  </main>

<script>
// ---- soft procedural corner florals: gradient-shaded blooms, redrawn differently each load ----
const rnd = (a, b) => a + Math.random() * (b - a);
const ri  = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
// soft watercolor pastels — blush, rose, dusty pink, cream/white
const PALETTE = ['#eba7bd', '#e58aa5', '#f0c8d2', '#d98fa8', '#f3d7bf', '#fbf3ec', '#f7ece0', '#e9b7c6', '#dd9ab4'];

const GRADS = `
  <radialGradient id="hi" cx="40%" cy="30%" r="58%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity=".42"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sh" cx="50%" cy="52%" r="52%">
    <stop offset="62%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#7a4a58" stop-opacity=".22"/>
  </radialGradient>
  <radialGradient id="goldc" cx="44%" cy="38%" r="62%">
    <stop offset="0%" stop-color="#fff2cf"/><stop offset="60%" stop-color="#f2d08a"/><stop offset="100%" stop-color="#caa24f"/>
  </radialGradient>
  <linearGradient id="leafg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#c4d8b3"/><stop offset="55%" stop-color="#9cbb90"/><stop offset="100%" stop-color="#799a6e"/>
  </linearGradient>`;

// rose: layered curled petals (tintable) with soft shaded throat
function roseSymbol() {
  let o = '', m = '';
  for (let i = 0; i < 5; i++) o += `<path d="M25 6 C34 8 39 18 33 26 C27 24 22 15 25 6Z" transform="rotate(${i*72} 25 25)"/>`;
  for (let i = 0; i < 5; i++) m += `<path d="M25 13 C31 15 34 22 29 27 C24 24 22 18 25 13Z" transform="rotate(${i*72+36} 25 25)"/>`;
  return `<symbol id="rose" viewBox="0 0 50 50"><g fill="currentColor">${o}${m}<circle cx="25" cy="25" r="4.5"/></g>`
    + `<path d="M25 21 A4 4 0 1 1 24.6 21.1" fill="none" stroke="#00000022" stroke-width="1.6"/>`
    + `<circle cx="25" cy="25" r="20" fill="url(#sh)"/><circle cx="25" cy="25" r="20" fill="url(#hi)"/></symbol>`;
}

// soft 5-petal blossom (tintable) with a gold pollen centre
function flowerSymbol() {
  let p = '';
  for (let i = 0; i < 5; i++) p += `<path d="M20 4 C26 9 27 17 20 23 C13 17 14 9 20 4Z" transform="rotate(${i*72} 20 20)"/>`;
  return `<symbol id="fl" viewBox="0 0 40 40"><g fill="currentColor">${p}</g>`
    + `<circle cx="20" cy="20" r="4.5" fill="url(#goldc)"/>`
    + `<circle cx="20" cy="20" r="17" fill="url(#sh)"/><circle cx="20" cy="20" r="17" fill="url(#hi)"/></symbol>`;
}

// closed rosebud with green sepals
const BUD = `<symbol id="bud" viewBox="0 0 26 36">
  <path d="M13 36 C9 28 9 21 13 17 C17 21 17 28 13 36Z" fill="url(#leafg)"/>
  <path d="M13 2 C19 8 19 19 13 24 C7 19 7 8 13 2Z" fill="currentColor"/>
  <path d="M13 5 C15 11 15 18 13 23" fill="none" stroke="#00000020" stroke-width="1.4"/>
  <path d="M13 24 C10 22 8.6 20 8 17 M13 24 C16 22 17.4 20 18 17" fill="none" stroke="#799a6e" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M13 2 C19 8 19 19 13 24 C7 19 7 8 13 2Z" fill="url(#hi)"/></symbol>`;

const LEAF = `<symbol id="lf" viewBox="0 0 30 20">
  <path d="M1 10 C8 1 22 1 29 10 C22 19 8 19 1 10Z" fill="url(#leafg)"/>
  <path d="M3 10 H27" stroke="#4f6a44" stroke-width="1" opacity=".5"/>
  <path d="M11 6 L9 10 M17 6 L15 10 M11 14 L9 10 M17 14 L15 10 M22 8 L20.5 10 M22 12 L20.5 10" stroke="#4f6a44" stroke-width=".7" opacity=".35" fill="none"/></symbol>`;

document.querySelector('#defs defs').innerHTML =
  GRADS + LEAF + flowerSymbol() + roseSymbol() + BUD;

const at = (id, x, y, r, extra = '') => `<use href="#${id}" x="${(x-r/2).toFixed(1)}" y="${(y-r/2).toFixed(1)}" width="${r.toFixed(1)}" height="${r.toFixed(1)}" ${extra}/>`;
const bloom = (id, x, y, r) => at(id, x, y, r, `transform="rotate(${ri(0,360)} ${x.toFixed(1)} ${y.toFixed(1)})" style="color:${pick(PALETTE)}"`);
const leaf  = (x, y, a, w) => `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${a.toFixed(0)})"><use href="#lf" width="${w.toFixed(0)}" height="${(w*0.66).toFixed(0)}"/></g>`;

// a lush-but-soft bouquet hugging the top-left corner (mirrored into the other corners via CSS)
function cluster() {
  let s = '';
  const band = 95, along = 215;
  // a random point in the L-band that hugs the two edges near this corner
  const rpos = () => Math.random() < 0.5 ? [rnd(-8, along), rnd(-8, band)] : [rnd(-8, band), rnd(-8, along)];
  // greenery first
  for (let i = 0; i < ri(11, 15); i++) { const [x, y] = rpos(); s += leaf(x, y, ri(0, 360), rnd(30, 56)); }
  // big anchor blooms clustered at the very corner
  s += bloom('rose', rnd(16, 40), rnd(16, 40), rnd(60, 80));
  s += bloom('rose', rnd(56, 96), rnd(4, 30), rnd(44, 60));
  s += bloom('rose', rnd(4, 30), rnd(56, 96), rnd(44, 60));
  s += bloom('fl',   rnd(64, 108), rnd(64, 108), rnd(30, 44));
  // fill blooms trailing along the two edges
  for (let i = 0; i < ri(8, 11); i++) {
    const [x, y] = rpos();
    const t = Math.random();
    if (t < 0.45) s += bloom('rose', x, y, rnd(30, 48));
    else if (t < 0.72) s += bloom('fl', x, y, rnd(22, 34));
    else s += bloom('bud', x, y, rnd(20, 30));
  }
  return s;
}

document.querySelectorAll('.corner').forEach(c => c.innerHTML = cluster());

// ponytail: sanity check the generator actually produced blooms
console.assert(document.querySelectorAll('.corner.tl use').length > 6, 'corner floral generator produced too few blooms');
</script>
</body>
</html>
