<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ===== EDIT THESE ===== -->
<title>Save the Date — Ridhiman & Vijit</title>
<meta property="og:title" content="Save the Date — Ridhiman & Vijit">
<meta property="og:description" content="We're getting married! February 27th, 2027 — Panchkula, India.">
<meta name="theme-color" content="#c02a72">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#3a3350; --mauve:#7c6a86; --rose1:#d6297a; --rose2:#a81e63; --btn:#b83f77;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:linear-gradient(165deg,#fdf5ef 0%,#fbeef0 55%,#f8e7ec 100%);
    color:var(--navy);
    font-family:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
    min-height:100dvh; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }

  /* ---------- the invitation (revealed after opening) ---------- */
  .stage{min-height:100dvh; display:grid; place-items:center; padding:2rem; text-align:center;
    opacity:0; transform:scale(.97); transition:opacity 1s ease .35s, transform 1.1s ease .35s;}
  body.open .stage{opacity:1; transform:none}
  .card{max-width:38rem; position:relative; z-index:3; padding:1rem}
  .tagline{font-style:italic; font-size:clamp(1.05rem,3.4vw,1.35rem); opacity:.85; line-height:1.6; margin-bottom:1.8rem}
  .eyebrow{font-size:clamp(1.1rem,3.6vw,1.5rem); letter-spacing:.18em; text-transform:uppercase; font-weight:500; line-height:1.5}
  .names{font-family:"Great Vibes",cursive; font-weight:400; line-height:1.22; overflow:visible;
    font-size:clamp(3.6rem,13vw,6rem); margin:.5rem 0 .05rem; padding:.06em .3em 0;
    background:linear-gradient(92deg,var(--rose1),var(--rose2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .amp{font-style:italic; font-size:clamp(1.4rem,4vw,1.9rem); color:var(--mauve)}
  .date{font-size:clamp(1.5rem,5vw,2.15rem); color:var(--mauve); line-height:1.4; font-weight:500; margin-top:.3rem}
  .date span{display:block}
  .foot{margin-top:1.4rem; font-size:.95rem; letter-spacing:.22em; text-transform:uppercase; opacity:.75}
  .actions{display:flex; flex-wrap:wrap; gap:.9rem; justify-content:center; margin-top:2rem}
  .cta{font-family:"Cormorant Garamond",serif; display:inline-block; padding:.7rem 1.7rem;
    border:1px solid #cf9ab4; border-radius:2rem; color:var(--navy); text-decoration:none;
    letter-spacing:.16em; text-transform:uppercase; font-size:.82rem; font-weight:600;
    transition:background .2s,color .2s,border-color .2s;}
  .cta:hover{background:#f3dbe4; border-color:#c98aa8}
  .cta.primary{background:var(--btn); color:#fff; border-color:var(--btn)}
  .cta.primary:hover{background:#9d2c60; border-color:#9d2c60}

  /* soft pastel corner sprays */
  .corner{position:fixed; width:min(42vw,320px); aspect-ratio:1; z-index:1; pointer-events:none;
    opacity:0; transition:opacity 1.1s ease .55s; filter:drop-shadow(0 2px 3px rgba(120,80,95,.12))}
  body.open .corner{opacity:.95}
  .tl{top:0; left:0}
  .tr{top:0; right:0; transform:scaleX(-1)}
  .bl{bottom:0; left:0; transform:scaleY(-1)}
  .br{bottom:0; right:0; transform:scale(-1)}

  /* ---------- the envelope cover ---------- */
  .cover{position:fixed; inset:0; z-index:50; display:grid; place-items:center; gap:0;
    background:radial-gradient(120% 90% at 50% 40%, #fef7f1, #f6e2e8);
    cursor:pointer; transition:opacity .9s ease, transform .9s ease;}
  .cover.open{opacity:0; transform:scale(1.15); pointer-events:none}
  .envelope{position:relative; width:min(80vw,360px); aspect-ratio:3/2; perspective:1100px;
    filter:drop-shadow(0 22px 40px rgba(120,50,75,.28));}
  .envelope>div{position:absolute; inset:0; border-radius:12px}
  .env-base{background:linear-gradient(160deg,#fbe0d9,#f4c8cf)}
  .env-pocket{background:linear-gradient(160deg,#f7d3cd,#eeb9c2);
    clip-path:polygon(0 100%,100% 100%,100% 30%,50% 66%,0 30%)}
  .env-left{background:linear-gradient(120deg,#f9dad3,#f1c4cd); clip-path:polygon(0 26%,50% 62%,0 100%)}
  .env-right{background:linear-gradient(240deg,#f9dad3,#f1c4cd); clip-path:polygon(100% 26%,50% 62%,100% 100%)}
  .flap{transform-origin:top center; transform:rotateX(0deg); transition:transform .8s cubic-bezier(.6,.02,.3,1);
    clip-path:polygon(0 0,100% 0,50% 72%); background:linear-gradient(170deg,#f6cdd4,#eeb2bd); z-index:6; backface-visibility:hidden}
  .cover.open .flap{transform:rotateX(-172deg); z-index:1}
  .bow{position:absolute; top:40%; left:50%; width:38%; transform:translate(-50%,-50%); z-index:8;
    transition:opacity .35s ease, transform .5s ease}
  .cover.open .bow{opacity:0; transform:translate(-50%,-50%) scale(.6)}
  .monogram{position:absolute; bottom:15%; left:0; right:0; text-align:center; z-index:7;
    font-family:"Great Vibes",cursive; font-size:clamp(1.4rem,5vw,2rem); color:#9d2c60; transition:opacity .4s}
  .cover.open .monogram{opacity:0}
  .hint{position:absolute; left:0; right:0; bottom:-4.2rem; text-align:center; font-style:italic;
    font-size:1.1rem; color:var(--mauve); letter-spacing:.04em; animation:pulse 2.2s ease-in-out infinite}
  .cover.open .hint{opacity:0}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

  @media (max-height:560px) and (orientation:landscape){ .corner{display:none} }
  @media (prefers-reduced-motion:reduce){ .cover,.stage,.corner,.flap{transition:opacity .3s} }
</style>
</head>
<body>
  <svg id="defs" width="0" height="0" style="position:absolute" aria-hidden="true"><defs></defs></svg>

  <svg class="corner tl" viewBox="0 0 300 300" aria-hidden="true"></svg>
  <svg class="corner tr" viewBox="0 0 300 300" aria-hidden="true"></svg>
  <svg class="corner bl" viewBox="0 0 300 300" aria-hidden="true"></svg>
  <svg class="corner br" viewBox="0 0 300 300" aria-hidden="true"></svg>

  <div class="stage">
    <main class="card">
      <p class="tagline">Circle the date in your heart and your calendar!<br>We can't imagine celebrating without you there.</p>
      <p class="eyebrow">Save the Date<br>for the wedding of</p>
      <!-- EDIT: names -->
      <h1 class="names">Ridhiman</h1>
      <p class="amp">and</p>
      <h1 class="names">Vijit</h1>
      <!-- EDIT: date + place -->
      <p class="date"><span>Saturday</span><span>February 27th, 2027</span><span>Panchkula, India</span></p>
      <p class="foot">Formal invite to follow</p>
      <div class="actions">
        <!-- EDIT the calendar link's dates (YYYYMMDD) & details -->
        <a class="cta" target="_blank" rel="noopener"
           href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Ridhiman%20%26%20Vijit%27s%20Wedding&dates=20270227/20270228&details=Save%20the%20date%21%20Formal%20invite%20to%20follow.&location=Panchkula%2C%20India">
          Add to calendar
        </a>
        <!-- EDIT: RSVP phone number (keep tel: and +country code) -->
        <a class="cta primary" href="tel:+919781274023">RSVP — Call us</a>
      </div>
    </main>
  </div>

  <!-- envelope cover: click to open -->
  <div class="cover" id="cover" role="button" tabindex="0" aria-label="Open the save the date">
    <div class="envelope">
      <div class="env-base"></div>
      <div class="env-left"></div>
      <div class="env-right"></div>
      <div class="env-pocket"></div>
      <div class="monogram">R &amp; V</div>
      <div class="flap"></div>
      <svg class="bow" viewBox="0 0 120 96" aria-hidden="true">
        <defs><linearGradient id="rib" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ef9bb4"/><stop offset="1" stop-color="#b83f77"/></linearGradient></defs>
        <path d="M60 40 C55 58 49 74 44 92 L58 84 L61 58Z" fill="url(#rib)"/>
        <path d="M60 40 C65 58 71 74 76 92 L62 84 L59 58Z" fill="url(#rib)"/>
        <path d="M60 44 C42 24 10 26 10 46 C10 66 44 64 60 48Z" fill="url(#rib)"/>
        <path d="M60 44 C78 24 110 26 110 46 C110 66 76 64 60 48Z" fill="url(#rib)"/>
        <path d="M60 44 C50 40 46 40 40 44 C46 48 50 48 60 48Z" fill="#8f1f52" opacity=".5"/>
        <path d="M60 44 C70 40 74 40 80 44 C74 48 70 48 60 48Z" fill="#8f1f52" opacity=".5"/>
        <rect x="52" y="36" width="16" height="20" rx="6" fill="#a81e63"/>
      </svg>
    </div>
    <p class="hint">Tap to open</p>
  </div>

<script>
// ---- soft procedural corner florals (redrawn each load) ----
const rnd = (a, b) => a + Math.random() * (b - a);
const ri  = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const PALETTE = ['#eba7bd', '#e58aa5', '#f0c8d2', '#d98fa8', '#f3d7bf', '#fbf3ec', '#f7ece0', '#e9b7c6', '#dd9ab4'];

const GRADS = `
  <radialGradient id="goldc" cx="44%" cy="38%" r="62%">
    <stop offset="0%" stop-color="#fff2cf"/><stop offset="60%" stop-color="#f2d08a"/><stop offset="100%" stop-color="#caa24f"/>
  </radialGradient>
  <linearGradient id="leafg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#c4d8b3"/><stop offset="55%" stop-color="#9cbb90"/><stop offset="100%" stop-color="#799a6e"/>
  </linearGradient>`;

// rose: layered curled petals (tintable), soft — no shading disc
function roseSymbol() {
  let o = '', m = '';
  for (let i = 0; i < 5; i++) o += `<path d="M25 6 C34 8 39 18 33 26 C27 24 22 15 25 6Z" transform="rotate(${i*72} 25 25)" opacity=".92"/>`;
  for (let i = 0; i < 5; i++) m += `<path d="M25 13 C31 15 34 22 29 27 C24 24 22 18 25 13Z" transform="rotate(${i*72+36} 25 25)"/>`;
  return `<symbol id="rose" viewBox="0 0 50 50"><g fill="currentColor">${o}${m}<circle cx="25" cy="25" r="4.2"/></g>`
    + `<path d="M25 21 A4 4 0 1 1 24.6 21.1" fill="none" stroke="#00000018" stroke-width="1.4"/></symbol>`;
}

// soft 5-petal blossom (tintable) with a gold pollen centre
function flowerSymbol() {
  let p = '';
  for (let i = 0; i < 5; i++) p += `<path d="M20 4 C26 9 27 17 20 23 C13 17 14 9 20 4Z" transform="rotate(${i*72} 20 20)"/>`;
  return `<symbol id="fl" viewBox="0 0 40 40"><g fill="currentColor">${p}</g>`
    + `<circle cx="20" cy="20" r="4.5" fill="url(#goldc)"/></symbol>`;
}

const BUD = `<symbol id="bud" viewBox="0 0 26 36">
  <path d="M13 36 C9 28 9 21 13 17 C17 21 17 28 13 36Z" fill="url(#leafg)"/>
  <path d="M13 2 C19 8 19 19 13 24 C7 19 7 8 13 2Z" fill="currentColor"/>
  <path d="M13 24 C10 22 8.6 20 8 17 M13 24 C16 22 17.4 20 18 17" fill="none" stroke="#799a6e" stroke-width="1.6" stroke-linecap="round"/></symbol>`;

const LEAF = `<symbol id="lf" viewBox="0 0 30 20">
  <path d="M1 10 C8 1 22 1 29 10 C22 19 8 19 1 10Z" fill="url(#leafg)"/>
  <path d="M3 10 H27" stroke="#4f6a44" stroke-width="1" opacity=".5"/>
  <path d="M11 6 L9 10 M17 6 L15 10 M11 14 L9 10 M17 14 L15 10 M22 8 L20.5 10 M22 12 L20.5 10" stroke="#4f6a44" stroke-width=".7" opacity=".35" fill="none"/></symbol>`;

document.querySelector('#defs defs').innerHTML = GRADS + LEAF + flowerSymbol() + roseSymbol() + BUD;

const at = (id, x, y, r, extra = '') => `<use href="#${id}" x="${(x-r/2).toFixed(1)}" y="${(y-r/2).toFixed(1)}" width="${r.toFixed(1)}" height="${r.toFixed(1)}" ${extra}/>`;
const bloom = (id, x, y, r) => at(id, x, y, r, `transform="rotate(${ri(0,360)} ${x.toFixed(1)} ${y.toFixed(1)})" style="color:${pick(PALETTE)}"`);
const leaf  = (x, y, a, w) => `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${a.toFixed(0)})"><use href="#lf" width="${w.toFixed(0)}" height="${(w*0.66).toFixed(0)}"/></g>`;

// a soft bouquet hugging the top-left corner (mirrored into the other corners via CSS)
function cluster() {
  let s = '';
  const band = 90, along = 200;
  const rpos = () => Math.random() < 0.5 ? [rnd(-8, along), rnd(-8, band)] : [rnd(-8, band), rnd(-8, along)];
  for (let i = 0; i < ri(9, 12); i++) { const [x, y] = rpos(); s += leaf(x, y, ri(0, 360), rnd(30, 54)); }
  s += bloom('rose', rnd(16, 40), rnd(16, 40), rnd(58, 76));
  s += bloom('rose', rnd(56, 96), rnd(4, 28), rnd(42, 56));
  s += bloom('rose', rnd(4, 28), rnd(56, 96), rnd(42, 56));
  s += bloom('fl',   rnd(64, 104), rnd(64, 104), rnd(28, 40));
  for (let i = 0; i < ri(6, 8); i++) {
    const [x, y] = rpos(), t = Math.random();
    if (t < 0.45) s += bloom('rose', x, y, rnd(28, 44));
    else if (t < 0.72) s += bloom('fl', x, y, rnd(22, 32));
    else s += bloom('bud', x, y, rnd(20, 28));
  }
  return s;
}
document.querySelectorAll('.corner').forEach(c => c.innerHTML = cluster());

// ---- envelope open interaction ----
const cover = document.getElementById('cover');
function openInvite() {
  if (document.body.classList.contains('open')) return;
  document.body.classList.add('open');
  cover.classList.add('open');
  setTimeout(() => cover.remove(), 1200);
}
cover.addEventListener('click', openInvite);
cover.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openInvite(); } });

// ponytail: sanity check the generator actually produced blooms
console.assert(document.querySelectorAll('.corner.tl use').length > 6, 'corner floral generator produced too few blooms');
</script>
</body>
</html>
