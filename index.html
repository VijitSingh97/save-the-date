<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ===== EDIT THESE ===== -->
<title>Save the Date</title>
<meta property="og:title" content="Save the Date — Ridhiman & Vijit">
<meta property="og:description" content="We're getting married! February 27, 2027.">
<meta name="theme-color" content="#b8860b">
<style>
  :root{
    /* EDIT: colors */
    --ink:#7a0e2b;      /* deep bridal maroon — names & text */
    --accent:#b8860b;   /* deep gold — eyebrow, borders */
    --maroon:#9d1732;   /* filled button */
    --muted:#c01a63;    /* rani pink — location */
    --pink:#e6007e; --red:#c8102e; --orange:#f4802a; --gold:#e6b422; --green:#2f8f5b;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:linear-gradient(160deg,#fff2cf 0%,#ffe6cb 52%,#ffdfe0 100%);
    color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    display:grid; place-items:center; min-height:100dvh; padding:2rem; text-align:center;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  .card{max-width:34rem; animation:rise .9s ease both; position:relative; z-index:3;
    padding:2.4rem 1.5rem; margin:6.5rem 0;
    background:radial-gradient(115% 88% at 50% 45%, rgba(255,250,244,.97) 60%, rgba(255,250,244,.82) 82%, rgba(255,250,244,0) 100%);
    border-radius:24px;}
  @keyframes rise{from{opacity:0; transform:translateY(12px)}to{opacity:1}}
  .eyebrow{letter-spacing:.35em; text-transform:uppercase; font-size:.72rem; color:var(--accent)}
  .names{font-size:clamp(2.6rem,9vw,4.5rem); line-height:1.05; margin:1.2rem 0; color:var(--ink)}
  .amp{display:block; font-style:italic; font-size:.5em; color:var(--accent); margin:.15em 0}
  .line{font-size:1.15rem; margin:.4rem 0}
  .date{font-size:1.5rem; letter-spacing:.02em}
  .muted{color:var(--muted)}
  .actions{display:flex; flex-wrap:wrap; gap:.8rem; justify-content:center}
  .cta{
    display:inline-block; margin-top:2rem; padding:.8rem 1.6rem;
    border:1px solid var(--accent); border-radius:2rem; color:var(--ink);
    text-decoration:none; letter-spacing:.12em; text-transform:uppercase; font-size:.75rem;
    transition:background .2s,color .2s;
  }
  .cta:hover{background:var(--accent); color:#fff}
  .cta.primary{background:var(--maroon); color:#ffe08a; border-color:var(--maroon)}
  .cta.primary:hover{background:var(--ink); border-color:var(--ink); color:#ffe08a}
  .sprig{width:170px; aspect-ratio:2.9; margin:.5rem auto 0; display:block}
  /* floral framing — all content injected procedurally each load */
  .field,.garland,.side,.sprig{filter:drop-shadow(0 1px 1.4px rgba(80,12,28,.22))}
  .field{position:fixed; inset:0; width:100vw; height:100vh; z-index:0; pointer-events:none; opacity:.97}
  .garland{position:fixed; left:0; width:100%; display:block; z-index:2; pointer-events:none; opacity:.99}
  .garland.top{top:0}
  .garland.bottom{bottom:0; transform:rotate(180deg)}
  .side{position:fixed; top:50%; transform:translateY(-50%); width:min(20vw,120px);
    aspect-ratio:120/260; opacity:.97; pointer-events:none; z-index:2}
  .side.left{left:0}
  .side.right{right:0; transform:translateY(-50%) scaleX(-1)}
  @media (max-width:600px){ .side{display:none} }
  @media (max-height:560px){
    .garland,.side,.field{display:none}
    body{place-items:start center; padding-block:1.5rem}
    .card{margin:0}
    .names{font-size:clamp(2rem,7vw,3rem); margin:.6rem 0}
  }
</style>
</head>
<body>
  <svg id="defs" width="0" height="0" style="position:absolute" aria-hidden="true"><defs></defs></svg>

  <svg class="field" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
  <svg class="garland top" viewBox="0 0 1200 210" aria-hidden="true"></svg>
  <svg class="garland bottom" viewBox="0 0 1200 210" aria-hidden="true"></svg>
  <svg class="side left" viewBox="0 0 120 260" aria-hidden="true"></svg>
  <svg class="side right" viewBox="0 0 120 260" aria-hidden="true"></svg>

  <main class="card">
    <p class="eyebrow">Save the Date</p>
    <!-- EDIT: names -->
    <h1 class="names">Ridhiman<span class="amp">and</span>Vijit</h1>
    <svg class="sprig" viewBox="0 0 180 62" aria-hidden="true"></svg>
    <!-- EDIT: date + place -->
    <p class="line date">Saturday, February 27, 2027</p>
    <p class="line muted">Panchkula, Haryana</p>
    <p class="line">Formal invitation to follow</p>

    <div class="actions">
      <!-- EDIT the calendar link's dates (YYYYMMDD) & details -->
      <a class="cta" target="_blank" rel="noopener"
         href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Ridhiman%20%26%20Vijit%27s%20Wedding&dates=20270227/20270228&details=Save%20the%20date%21%20Formal%20invitation%20to%20follow.&location=Panchkula%2C%20Haryana">
        Add to calendar
      </a>
      <!-- EDIT: RSVP phone number (keep tel: and +country code) -->
      <a class="cta primary" href="tel:+919781274023">RSVP — Call us</a>
    </div>
  </main>

<script>
// ---- procedural floral generator: gradient-shaded blooms, redrawn differently every load ----
const rnd = (a, b) => a + Math.random() * (b - a);
const ri  = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const BRIGHT = ['#c8102e', '#d6266d', '#e6007e', '#e0a80f', '#f4802a', '#a51c30', '#c73c00', '#b8005c'];

// shared gradients: highlight (top-left sheen) + shadow vignette give every bloom a 3-D domed form
const GRADS = `
  <radialGradient id="hi" cx="40%" cy="28%" r="55%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity=".34"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sh" cx="50%" cy="48%" r="50%">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#3a0a12" stop-opacity=".3"/>
  </radialGradient>
  <radialGradient id="goldc" cx="44%" cy="36%" r="62%">
    <stop offset="0%" stop-color="#ffe9a8"/><stop offset="55%" stop-color="#e6b422"/><stop offset="100%" stop-color="#9c6f0a"/>
  </radialGradient>
  <linearGradient id="leafg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#57c483"/><stop offset="55%" stop-color="#2f8f5b"/><stop offset="100%" stop-color="#1c5c3a"/>
  </linearGradient>`;

// marigold (genda): three overlapping petal rings — true colour rim, dark recesses, sun-lit centre
function marigoldSymbol(id, main, deep, light) {
  const ring = (d, fill, step, start) => { let s = ''; for (let a = start; a < 360; a += step) s += `<path d="${d}" fill="${fill}" transform="rotate(${a} 30 30)"/>`; return s; };
  return `<symbol id="${id}" viewBox="0 0 60 60">`
    + ring('M30 3 C34.5 11 35 20 30 27 C25 20 25.5 11 30 3Z', main, 18, 0)
    + ring('M30 9 C33.5 15 34 21 30 27 C26 21 26.5 15 30 9Z', deep, 20, 9)
    + ring('M30 15 C32.5 19 32.5 23 30 27 C27.5 23 27.5 19 30 15Z', light, 30, 0)
    + `<circle cx="30" cy="30" r="6" fill="${light}"/><circle cx="30" cy="30" r="6" fill="url(#sh)"/>`
    + `<circle cx="30" cy="30" r="27" fill="url(#sh)"/><circle cx="30" cy="30" r="27" fill="url(#hi)"/></symbol>`;
}
const MARIS = [
  ['mariR', '#d21830', '#7e0c1a', '#f4728a'],  // bridal red
  ['mariM', '#d6266d', '#83063f', '#f27bad'],  // rani magenta
  ['mariG', '#eab418', '#a06f00', '#ffe07a'],  // mustard gold
  ['mariO', '#f4802a', '#b8480e', '#ffb15a'],  // marigold orange
  ['mariF', '#e6007e', '#8a0050', '#ff74bb'],  // fuchsia
];
const MARI_IDS = MARIS.map(m => m[0]);

// rose: layered curled petals (tintable) with a shaded throat and swirl centre
function roseSymbol() {
  let o = '', m = '';
  for (let i = 0; i < 5; i++) o += `<path d="M25 6 C34 8 39 18 33 26 C27 24 22 15 25 6Z" transform="rotate(${i*72} 25 25)"/>`;
  for (let i = 0; i < 5; i++) m += `<path d="M25 13 C31 15 34 22 29 27 C24 24 22 18 25 13Z" transform="rotate(${i*72+36} 25 25)"/>`;
  return `<symbol id="rose" viewBox="0 0 50 50"><g fill="currentColor">${o}${m}<circle cx="25" cy="25" r="4.5"/></g>`
    + `<path d="M25 21 A4 4 0 1 1 24.6 21.1" fill="none" stroke="#0000002e" stroke-width="1.6"/>`
    + `<circle cx="25" cy="25" r="20" fill="url(#sh)"/><circle cx="25" cy="25" r="20" fill="url(#hi)"/></symbol>`;
}

// soft 5-petal blossom (tintable) with a gold pollen centre
function flowerSymbol() {
  let p = '';
  for (let i = 0; i < 5; i++) p += `<path d="M20 4 C26 9 27 17 20 23 C13 17 14 9 20 4Z" transform="rotate(${i*72} 20 20)"/>`;
  return `<symbol id="fl" viewBox="0 0 40 40"><g fill="currentColor">${p}</g>`
    + `<circle cx="20" cy="20" r="5" fill="url(#goldc)"/>`
    + `<circle cx="20" cy="20" r="17" fill="url(#sh)"/><circle cx="20" cy="20" r="17" fill="url(#hi)"/></symbol>`;
}

// closed rosebud with green sepals
const BUD = `<symbol id="bud" viewBox="0 0 26 36">
  <path d="M13 36 C9 28 9 21 13 17 C17 21 17 28 13 36Z" fill="url(#leafg)"/>
  <path d="M13 2 C19 8 19 19 13 24 C7 19 7 8 13 2Z" fill="currentColor"/>
  <path d="M13 5 C15 11 15 18 13 23" fill="none" stroke="#00000028" stroke-width="1.4"/>
  <path d="M13 24 C10 22 8.6 20 8 17 M13 24 C16 22 17.4 20 18 17" fill="none" stroke="#1c5c3a" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M13 2 C19 8 19 19 13 24 C7 19 7 8 13 2Z" fill="url(#hi)"/></symbol>`;

const LEAF = `<symbol id="lf" viewBox="0 0 30 20">
  <path d="M1 10 C8 1 22 1 29 10 C22 19 8 19 1 10Z" fill="url(#leafg)"/>
  <path d="M3 10 H27" stroke="#16472c" stroke-width="1" opacity=".55"/>
  <path d="M11 6 L9 10 M17 6 L15 10 M11 14 L9 10 M17 14 L15 10 M22 8 L20.5 10 M22 12 L20.5 10" stroke="#16472c" stroke-width=".7" opacity=".4" fill="none"/></symbol>`;

function lotusSymbol() {
  const t = 'M45 52 C35 38 39 18 45 6 C51 18 55 38 45 52Z', inner = 'M45 52 C39 42 41 30 45 22 C49 30 51 42 45 52Z';
  let s = '<symbol id="lotus" viewBox="0 0 90 58">';
  [[-52,'#f7a9c6'],[-34,'#f28fb4'],[-17,'#ec6a9c'],[0,'#e0508a'],[17,'#ec6a9c'],[34,'#f28fb4'],[52,'#f7a9c6']]
    .forEach(([a,c]) => s += `<path d="${t}" fill="${c}" transform="rotate(${a} 45 52)"/>`);
  [-22,0,22].forEach(a => s += `<path d="${inner}" fill="#fbd0e0" transform="rotate(${a} 45 52)"/>`);
  s += '<ellipse cx="45" cy="50" rx="7" ry="4" fill="url(#goldc)"/>';
  return s + '<ellipse cx="45" cy="30" rx="45" ry="30" fill="url(#hi)"/></symbol>';
}

document.querySelector('#defs defs').innerHTML =
  GRADS + LEAF + flowerSymbol() + roseSymbol() + BUD + MARIS.map(m => marigoldSymbol(...m)).join('') + lotusSymbol();

// placement helpers
const at = (id, x, y, r, extra = '') => `<use href="#${id}" x="${(x-r/2).toFixed(1)}" y="${(y-r/2).toFixed(1)}" width="${r.toFixed(1)}" height="${r.toFixed(1)}" ${extra}/>`;
const flower = (id, x, y, r) => at(id, x, y, r);
const tinted = (id, x, y, r) => at(id, x, y, r, `style="color:${pick(BRIGHT)}"`);
const spun   = (id, x, y, r) => at(id, x, y, r, `transform="rotate(${ri(0,360)} ${x.toFixed(1)} ${y.toFixed(1)})" style="color:${pick(BRIGHT)}"`);
const leaf   = (x, y, a, w) => `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${a.toFixed(0)})"><use href="#lf" width="${w}" height="${(w*0.66).toFixed(0)}"/></g>`;

// garden field: fill empty space around the text with a natural mix of blooms
function scatterField(W, H, rect) {
  const pad = 20, step = 62, jit = 22;
  const inCard = (x, y, s) => x > rect.left - pad - s && x < rect.right + pad + s && y > rect.top - pad - s && y < rect.bottom + pad + s;
  let s = '';
  for (let gy = step/2; gy < H + step; gy += step) {
    for (let gx = step/2; gx < W + step; gx += step) {
      const x = gx + rnd(-jit, jit), y = gy + rnd(-jit, jit), sz = rnd(15, 32);
      if (inCard(x, y, sz)) continue;
      const t = Math.random();
      if (t < 0.24)      s += spun('rose', x, y, sz * 1.05);
      else if (t < 0.52) s += flower(pick(MARI_IDS), x, y, sz);
      else if (t < 0.70) s += spun('fl', x, y, sz * 0.9);
      else if (t < 0.82) s += spun('bud', x, y, sz * 0.85);
      else               s += leaf(x, y, ri(0, 360), ri(18, 26)) + leaf(x + 6, y + 5, ri(0, 360), ri(15, 21));
    }
  }
  return s;
}

// festoon garland — random swag depth, colours, sizes, leaves, hanging danglers
function garland() {
  const W = 1200, amp = rnd(36, 56), base = rnd(6, 14), cy = x => base + amp * Math.sin(Math.PI * x / W);
  let pts = [];
  for (let x = 0; x <= W; x += 20) pts.push(`${x},${cy(x).toFixed(1)}`);
  let s = `<polyline points="${pts.join(' ')}" fill="none" stroke="#2f7a4c" stroke-width="3"/>`;
  const nLeaf = ri(24, 32);
  for (let i = 0; i <= nLeaf; i++) { const x = i*W/nLeaf; s += leaf(x, cy(x), (i%2 ? -145 : -35) + rnd(-12,12), ri(22,28)); }
  const nFl = ri(16, 20);
  for (let i = 0; i <= nFl; i++) { const x = i*W/nFl + rnd(-10,10); s += (Math.random() < 0.72 ? flower(pick(MARI_IDS), x, cy(x), rnd(19,27)) : spun('rose', x, cy(x), rnd(20,26))); }
  const nD = ri(4, 7);
  for (let i = 0; i < nD; i++) {
    const x = rnd(0.07, 0.93)*W, y0 = cy(x), dl = rnd(35, 82), r = rnd(23, 33);
    s += `<line x1="${x.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x.toFixed(1)}" y2="${(y0+dl).toFixed(1)}" stroke="#2f7a4c" stroke-width="2.2"/>`;
    s += `<g transform="translate(${x.toFixed(1)} ${(y0+dl*0.55).toFixed(1)}) rotate(-90)"><use href="#lf" width="22" height="14"/></g>`;
    s += (Math.random() < 0.5 ? spun('rose', x, y0+dl, r) : flower(pick(MARI_IDS), x, y0+dl, r));
  }
  return s;
}

// vertical side spray of mixed realistic blooms
function side() {
  let s = '<path d="M18 0 C22 60 30 110 26 150 C22 190 34 230 60 258" fill="none" stroke="#2f7a4c" stroke-width="2.5" stroke-linecap="round"/>';
  [[30,44,30],[24,110,60],[30,178,25],[36,236,40]].forEach(([x,y,a]) => s += leaf(x, y, a + rnd(-10,10), ri(26,30)));
  s += flower(pick(MARI_IDS), 26, 28, rnd(38,46));
  s += spun('rose', 54, 52, rnd(30,38));
  s += spun('fl', 22, 96, rnd(22,28));
  s += flower(pick(MARI_IDS), 44, 132, rnd(32,40));
  s += spun('rose', 24, 176, rnd(30,38));
  s += spun('bud', 58, 150, rnd(20,26));
  s += flower(pick(MARI_IDS), 46, 214, rnd(30,38));
  return s;
}

// divider under the names: two marigolds flanking a lotus
function divider() {
  let s = '<path d="M20 40 Q90 60 160 40" fill="none" stroke="#2f7a4c" stroke-width="2"/>';
  s += leaf(24, 26, -20 + rnd(-8,8), 26);
  s += `<g transform="translate(150 26) rotate(${(20+rnd(-8,8)).toFixed(0)}) scale(-1,1)"><use href="#lf" width="26" height="17"/></g>`;
  s += flower(pick(MARI_IDS), 46, 31, 27);
  s += flower(pick(MARI_IDS), 134, 31, 27);
  s += '<use href="#lotus" x="60" y="2" width="60" height="40"/>';
  return s;
}

// paint the background field to fill empty space around the (measured) card
function paintField() {
  const f = document.querySelector('.field'), fr = f.getBoundingClientRect();
  const W = Math.round(fr.width) || window.innerWidth || 1200, H = Math.round(fr.height) || window.innerHeight || 800;
  f.setAttribute('viewBox', `0 0 ${W} ${H}`);
  f.innerHTML = scatterField(W, H, document.querySelector('.card').getBoundingClientRect());
}

document.querySelector('.garland.top').innerHTML = garland();
document.querySelector('.garland.bottom').innerHTML = garland();
document.querySelector('.side.left').innerHTML = side();
document.querySelector('.side.right').innerHTML = side();
document.querySelector('.sprig').innerHTML = divider();
paintField();

// keep the field filling space if the window is resized (debounced)
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(paintField, 200); });

// ponytail: sanity check the generators actually produced blooms
console.assert(document.querySelectorAll('.garland.top use').length > 8 && document.querySelectorAll('.field use').length > 20,
  'floral generator produced too few blooms');
</script>
</body>
</html>
