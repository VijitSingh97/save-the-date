<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Save the Date — Ridhiman & Vijit</title>
<meta property="og:title" content="Save the Date — Ridhiman & Vijit">
<meta property="og:description" content="We're getting married! February 27th, 2027 — Panchkula, India.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ridhiman-and-vijit.com/">
<meta property="og:image" content="https://ridhiman-and-vijit.com/assets/og-image.png">

<meta name="twitter:description" content="February 27th, 2027 — Panchkula, India.">
<meta name="twitter:image" content="https://ridhiman-and-vijit.com/assets/og-image.png">
<meta name="theme-color" content="#c02a72">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#3a3350; --mauve:#64506e; --rose1:#d6297a; --rose2:#a81e63; --btn:#b83f77; }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:linear-gradient(165deg,#fdf5ef 0%,#fbeef0 55%,#f8e7ec 100%);
    color:var(--navy);
    font-family:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
    min-height:100dvh; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }

  /* ---------- the invitation ---------- */
  .stage{min-height:100dvh; display:grid; place-items:center; padding:clamp(1rem,3vh,2.5rem) 1.5rem; text-align:center;
    opacity:0; transform:scale(.97); transition:opacity 1s ease .4s, transform 1.1s ease .4s;}
  body.open .stage{opacity:1; transform:none}
  .card{width:100%; max-width:34rem; position:relative; z-index:3; padding:1rem}
  .tagline{font-style:italic; font-size:clamp(1.05rem,3.4vw,1.35rem); opacity:.85; line-height:1.6; margin-bottom:.5rem}
  .divider{display:block; width:140px; height:auto; margin:.1rem auto .9rem; opacity:.92}
  .eyebrow{font-size:clamp(1.1rem,3.6vw,1.5rem); letter-spacing:.18em; text-transform:uppercase; font-weight:500; line-height:1.5}
  .names{font-family:"Great Vibes",cursive; font-weight:400; line-height:1.22; overflow:visible;
    font-size:min(clamp(3.25rem,13vw,6rem),10vh); margin:.1rem 0 0; padding:.06em .3em 0;
    background:linear-gradient(92deg,var(--rose1),var(--rose2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .amp{font-style:italic; font-size:clamp(1.4rem,4vw,1.9rem); color:var(--mauve)}
  .date{font-size:min(clamp(1.5rem,5vw,2.15rem),4.6vh); color:var(--mauve); line-height:1.35; font-weight:500; margin-top:.3rem}
  .date span{display:block}
  .foot{margin-top:1rem; font-size:.95rem; letter-spacing:.22em; text-transform:uppercase; opacity:.9}
  .actions{display:flex; flex-wrap:wrap; gap:.9rem; justify-content:center; margin-top:1.4rem}
  .cta{font-family:"Cormorant Garamond",serif; display:inline-block; padding:.7rem 1.7rem;
    border:1px solid #cf9ab4; border-radius:2rem; color:var(--navy); text-decoration:none;
    letter-spacing:.16em; text-transform:uppercase; font-size:.82rem; font-weight:600;
    transition:background .2s,color .2s,border-color .2s;}
  .cta:hover{background:#f3dbe4; border-color:#c98aa8}
  .cta.primary{background:var(--btn); color:#fff; border-color:var(--btn)}
  .cta.primary:hover{background:#9d2c60; border-color:#9d2c60}

  /* ---------- floral corner frame (marigolds & roses, hand-shaded SVG) ---------- */
  .corner{position:fixed; width:min(42vw,320px); height:auto; z-index:1; pointer-events:none;
    opacity:0; transition:opacity 1.1s ease .55s; filter:drop-shadow(0 3px 6px rgba(120,30,50,.22));}
  body.open .corner{opacity:.96}
  .corner.tl{top:0; left:0}
  .corner.tr{top:0; right:0; transform:scaleX(-1)}
  .corner.bl{bottom:0; left:0; transform:scaleY(-1)}
  .corner.br{bottom:0; right:0; transform:scale(-1,-1)}
  @media (max-height:560px) and (orientation:landscape){ .corner{display:none} }

  /* ---------- full-page envelope cover ---------- */
  .cover{position:fixed; inset:0; z-index:50; cursor:pointer; overflow:hidden; perspective:1800px;
    transition:opacity 1s ease .5s;}
  .cover.open{opacity:0; pointer-events:none;}
  .cover .layer{position:absolute; inset:0;}
  .env-base{background:linear-gradient(155deg,#f7e2e3 0%,#eccdd4 100%);}
  .env-left{background:linear-gradient(88deg,#f1d3d9,#e5bfc9); clip-path:polygon(0 0,50% 50%,0 100%);}
  .env-right{background:linear-gradient(272deg,#f1d3d9,#e5bfc9); clip-path:polygon(100% 0,50% 50%,100% 100%);}
  .env-pocket{background:linear-gradient(175deg,#f4d9de 0%,#e7cad2 100%);
    clip-path:polygon(0 100%,100% 100%,50% 47%); filter:drop-shadow(0 -5px 12px rgba(150,88,110,.13));}
  .flap{transform-origin:top center; transform:rotateX(0deg); transition:transform 1.05s cubic-bezier(.5,0,.15,1);
    background:linear-gradient(178deg,#fae9eb 0%,#efd3da 100%); clip-path:polygon(0 0,100% 0,50% 53%);
    filter:drop-shadow(0 5px 11px rgba(150,88,110,.18)); z-index:6; backface-visibility:hidden;}
  .cover.open .flap{transform:rotateX(-178deg); z-index:1;}
  .seal{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:min(48vw,270px); z-index:8;
    filter:drop-shadow(0 7px 13px rgba(110,20,45,.32)); transition:opacity .4s ease, transform .55s ease;}
  .cover.open .seal{opacity:0; transform:translate(-50%,-50%) scale(.7);}
  .env-names{position:absolute; left:0; right:0; top:64%; text-align:center; z-index:7;
    font-family:"Great Vibes",cursive; font-size:clamp(2rem,7.5vw,3.2rem); color:#9d2c60; transition:opacity .4s;}
  .cover.open .env-names{opacity:0;}
  .hint{position:absolute; left:0; right:0; bottom:7%; text-align:center; font-style:italic; z-index:7;
    font-size:1.05rem; color:#a76a86; letter-spacing:.1em; text-transform:uppercase; animation:pulse 2.2s ease-in-out infinite;}
  .cover.open .hint{opacity:0;}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:.95}}
  /* wider florals on large screens to fill the empty margins */
  @media (min-width:1100px){ .corner{width:360px} }
  /* mobile: tighten tracking & stack CTAs so nothing overflows */
  @media (max-width:480px){
    .eyebrow{letter-spacing:.1em}
    .foot{letter-spacing:.14em}
    .cta{letter-spacing:.1em; width:100%; text-align:center}
    .actions{gap:.7rem}
    .corner{width:46vw}
  }
  @media (prefers-reduced-motion:reduce){ .cover,.stage,.corner,.flap,.seal{transition:opacity .3s;} }
</style>
</head>
<body>
  <picture><source srcset="assets/corner-watercolor.webp" type="image/webp"><img class="corner tl" src="assets/corner-watercolor.png" alt="" aria-hidden="true"></picture>
  <picture><source srcset="assets/corner-watercolor.webp" type="image/webp"><img class="corner tr" src="assets/corner-watercolor.png" alt="" aria-hidden="true"></picture>
  <picture><source srcset="assets/corner-watercolor.webp" type="image/webp"><img class="corner bl" src="assets/corner-watercolor.png" alt="" aria-hidden="true"></picture>
  <picture><source srcset="assets/corner-watercolor.webp" type="image/webp"><img class="corner br" src="assets/corner-watercolor.png" alt="" aria-hidden="true"></picture>

  <div class="stage">
    <main class="card">
      <p class="tagline">Circle the date in your heart and your calendar!<br>We can't imagine celebrating without you there.</p>
      <svg class="divider" viewBox="0 0 200 24" aria-hidden="true">
        <g stroke="#c98aa8" stroke-width="1.4" fill="none" stroke-linecap="round">
          <path d="M6 12 H78"/><path d="M122 12 H194"/>
        </g>
        <g transform="translate(88 12)"><path d="M0 0 C-9 -5 -16 -3 -22 4 C-13 5 -6 4 0 0 Z" fill="#4f9152"/></g>
        <g transform="translate(112 12)"><path d="M0 0 C9 -5 16 -3 22 4 C13 5 6 4 0 0 Z" fill="#4f9152"/></g>
        <g transform="translate(100 12)">
          <circle r="6.2" fill="#e8850f"/>
          <circle r="6.2" fill="none" stroke="#c23a06" stroke-width="1.1" stroke-dasharray="1 1.9"/>
          <circle r="2.2" fill="#8a2402"/>
        </g>
      </svg>
      <p class="eyebrow">Save the Date<br>for the wedding of</p>
      <!-- EDIT: names -->
      <h1 class="names">Ridhiman</h1>
      <p class="amp">and</p>
      <h1 class="names">Vijit</h1>
      <!-- EDIT: date + place -->
      <p class="date"><span>Saturday</span><span>February 27th, 2027</span><span>Panchkula, India</span></p>
      <p class="foot">Formal invite to follow</p>
      <div class="actions">
        <!-- EDIT the calendar link's dates (YYYYMMDD) & details -->
        <a class="cta primary" target="_blank" rel="noopener"
           href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Ridhiman%20%26%20Vijit%27s%20Wedding&dates=20270227/20270228&details=Save%20the%20date%21%20Formal%20invite%20to%20follow.&location=Panchkula%2C%20India">
          Add to calendar
        </a>
      </div>
    </main>
  </div>

  <!-- full-page envelope cover: click to open -->
  <div class="cover" id="cover" role="button" tabindex="0" aria-label="Open the save the date">
    <div class="layer env-base"></div>
    <div class="layer env-left"></div>
    <div class="layer env-right"></div>
    <div class="layer env-pocket"></div>
    <div class="env-names">Ridhiman &amp; Vijit</div>
    <div class="layer flap"></div>
    <picture><source srcset="assets/seal.webp" type="image/webp"><img class="seal" src="assets/seal.png" alt="" aria-hidden="true"></picture>
    <p class="hint">Tap to open</p>
  </div>

<script>
  const cover = document.getElementById('cover');
  function openInvite() {
    if (document.body.classList.contains('open')) return;
    document.body.classList.add('open');
    cover.classList.add('open');
    setTimeout(() => cover.remove(), 1700);
  }
  cover.addEventListener('click', openInvite);
  cover.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openInvite(); } });
</script>
</body>
</html>
