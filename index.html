<title>Save the Date</title>
<meta property="og:title" content="Save the Date — Ridhiman & Vijit">
<meta property="og:description" content="We're getting married! February 27, 2027.">
<meta name="theme-color" content="#e0662a">
<style>
  :root{
    /* EDIT: colors */
    --ink:#6d2b3d;      /* deep rose — names & text */
    --accent:#e0662a;   /* orange — eyebrow, button */
    --muted:#c94f7c;    /* pink — location */
    --pink:#ec4f8c; --red:#e5383b; --orange:#f4802a; --gold:#f6c343; --green:#6aa06b;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:linear-gradient(160deg,#fff2e6 0%,#ffe9ef 55%,#ffe3ea 100%);
    color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    display:grid; place-items:center; min-height:100dvh; padding:2rem; text-align:center;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  .card{max-width:34rem; animation:rise .9s ease both; position:relative; z-index:2;
    padding:2.2rem 1.4rem; margin:6.5rem 0;
    background:radial-gradient(120% 90% at 50% 45%, rgba(255,250,244,.82) 55%, rgba(255,250,244,0) 100%);
    border-radius:24px;}
  @keyframes rise{from{opacity:0; transform:translateY(12px)}to{opacity:1}}
  .eyebrow{letter-spacing:.35em; text-transform:uppercase; font-size:.72rem; color:var(--accent)}
  .names{font-size:clamp(2.6rem,9vw,4.5rem); line-height:1.05; margin:1.2rem 0; color:var(--ink)}
  .amp{display:block; font-style:italic; font-size:.5em; color:var(--accent); margin:.15em 0}
  .line{font-size:1.15rem; margin:.4rem 0}
  .date{font-size:1.5rem; letter-spacing:.02em}
  .muted{color:var(--muted)}
  .actions{display:flex; flex-wrap:wrap; gap:.8rem; justify-content:center}
  .cta{
    display:inline-block; margin-top:2rem; padding:.8rem 1.6rem;
    border:1px solid var(--accent); border-radius:2rem; color:var(--accent);
    text-decoration:none; letter-spacing:.12em; text-transform:uppercase; font-size:.75rem;
    transition:background .2s,color .2s;
  }
  .cta:hover{background:var(--accent); color:#fff}
  .cta.primary{background:var(--accent); color:#fff}
  .cta.primary:hover{background:var(--muted); border-color:var(--muted)}
  .sprig{width:170px; aspect-ratio:2.9; margin:.5rem auto 0; display:block}
  /* Indian floral framing */
  .garland{position:fixed; left:0; width:100%; display:block; z-index:1; pointer-events:none; opacity:.98}
  .garland.top{top:0}
  .garland.bottom{bottom:0; transform:rotate(180deg)}
  .side{position:fixed; top:50%; transform:translateY(-50%); width:min(20vw,120px);
    aspect-ratio:120/260; opacity:.92; pointer-events:none; z-index:1}
  .side.left{left:0}
  .side.right{right:0; transform:translateY(-50%) scaleX(-1)}
  /* narrow screens: drop side paisleys so text stays clear (keep garlands) */
  @media (max-width:600px){ .side{display:none} }
  /* short viewports (landscape phones): hide all florals */
  @media (max-height:560px){
    .garland,.side{display:none}
    body{place-items:start center; padding-block:1.5rem}
    .card{margin:0}
    .names{font-size:clamp(2rem,7vw,3rem); margin:.6rem 0}
  }
</style>
</head>
