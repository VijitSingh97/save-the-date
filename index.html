<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ===== EDIT THESE ===== -->
<title>Save the Date</title>
<meta property="og:title" content="Save the Date — Ridhiman & Vijit">
<meta property="og:description" content="We're getting married! February 27, 2027.">
<meta name="theme-color" content="#e0662a">
<style>
  :root{
    /* EDIT: colors */
    --ink:#6d2b3d;      /* deep rose — names & text */
    --accent:#e0662a;   /* orange — eyebrow, button */
    --muted:#c94f7c;    /* pink — location */
    --pink:#ec4f8c; --red:#e5383b; --orange:#f4802a; --gold:#f6c343; --green:#6aa06b;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:linear-gradient(160deg,#fff2e6 0%,#ffe9ef 55%,#ffe3ea 100%);
    color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    display:grid; place-items:center; min-height:100dvh; padding:2rem; text-align:center;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  .card{max-width:34rem; animation:rise .9s ease both; position:relative; z-index:3;
    padding:2.4rem 1.5rem; margin:6.5rem 0;
    background:radial-gradient(115% 88% at 50% 45%, rgba(255,250,244,.97) 60%, rgba(255,250,244,.82) 82%, rgba(255,250,244,0) 100%);
    border-radius:24px;}
  @keyframes rise{from{opacity:0; transform:translateY(12px)}to{opacity:1}}
  .eyebrow{letter-spacing:.35em; text-transform:uppercase; font-size:.72rem; color:var(--accent)}
  .names{font-size:clamp(2.6rem,9vw,4.5rem); line-height:1.05; margin:1.2rem 0; color:var(--ink)}
  .amp{display:block; font-style:italic; font-size:.5em; color:var(--accent); margin:.15em 0}
  .line{font-size:1.15rem; margin:.4rem 0}
  .date{font-size:1.5rem; letter-spacing:.02em}
  .muted{color:var(--muted)}
  .actions{display:flex; flex-wrap:wrap; gap:.8rem; justify-content:center}
  .cta{
    display:inline-block; margin-top:2rem; padding:.8rem 1.6rem;
    border:1px solid var(--accent); border-radius:2rem; color:var(--accent);
    text-decoration:none; letter-spacing:.12em; text-transform:uppercase; font-size:.75rem;
    transition:background .2s,color .2s;
  }
  .cta:hover{background:var(--accent); color:#fff}
  .cta.primary{background:var(--accent); color:#fff}
  .cta.primary:hover{background:var(--muted); border-color:var(--muted)}
  .sprig{width:170px; aspect-ratio:2.9; margin:.5rem auto 0; display:block}
  /* Punjabi phulkari floral framing — all content injected procedurally each load */
  .field{position:fixed; inset:0; width:100vw; height:100vh; z-index:0; pointer-events:none; opacity:.9}
  .garland{position:fixed; left:0; width:100%; display:block; z-index:2; pointer-events:none; opacity:.98}
  .garland.top{top:0}
  .garland.bottom{bottom:0; transform:rotate(180deg)}
  .side{position:fixed; top:50%; transform:translateY(-50%); width:min(20vw,120px);
    aspect-ratio:120/260; opacity:.95; pointer-events:none; z-index:2}
  .side.left{left:0}
  .side.right{right:0; transform:translateY(-50%) scaleX(-1)}
  @media (max-width:600px){ .side{display:none} }
  @media (max-height:560px){
    .garland,.side,.field{display:none}
    body{place-items:start center; padding-block:1.5rem}
    .card{margin:0}
    .names{font-size:clamp(2rem,7vw,3rem); margin:.6rem 0}
  }
</style>
</head>
<body>
  <svg id="defs" width="0" height="0" style="position:absolute" aria-hidden="true"><defs></defs></svg>

  <svg class="field" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
  <svg class="garland top" viewBox="0 0 1200 210" aria-hidden="true"></svg>
  <svg class="garland bottom" viewBox="0 0 1200 210" aria-hidden="true"></svg>
  <svg class="side left" viewBox="0 0 120 260" aria-hidden="true"></svg>
  <svg class="side right" viewBox="0 0 120 260" aria-hidden="true"></svg>

  <main class="card">
    <p class="eyebrow">Save the Date</p>
    <!-- EDIT: names -->
    <h1 class="names">Ridhiman<span class="amp">and</span>Vijit</h1>
    <svg class="sprig" viewBox="0 0 180 62" aria-hidden="true"></svg>
    <!-- EDIT: date + place -->
    <p class="line date">Saturday, February 27, 2027</p>
    <p class="line muted">Panchkula, Haryana</p>
    <p class="line">Formal invitation to follow</p>

    <div class="actions">
      <!-- EDIT the calendar link's dates (YYYYMMDD) & details -->
      <a class="cta" target="_blank" rel="noopener"
         href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Ridhiman%20%26%20Vijit%27s%20Wedding&dates=20270227/20270228&details=Save%20the%20date%21%20Formal%20invitation%20to%20follow.&location=Panchkula%2C%20Haryana">
        Add to calendar
      </a>
      <!-- EDIT: RSVP phone number (keep tel: and +country code) -->
      <a class="cta primary" href="tel:+919781274023">RSVP — Call us</a>
    </div>
  </main>

<script>
// ---- procedural Punjabi/phulkari floral generator: redraws differently every load ----
const rnd = (a, b) => a + Math.random() * (b - a);
const ri  = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const BRIGHT = ['#d6266d', '#ec4f8c', '#f4802a', '#e5383b', '#f6a723', '#c02766', '#e0508a'];

// marigold (genda) — layered petal rings; one <symbol> per colourway
function marigoldSymbol(id, outer, mid, center, dot) {
  let o = '', m = '', d = '';
  for (let a = 0; a < 360; a += 24) o += `<ellipse cx="30" cy="7" rx="5" ry="10" transform="rotate(${a} 30 30)"/>`;
  for (let a = 12; a < 360; a += 24) m += `<ellipse cx="30" cy="15" rx="4.5" ry="8.5" transform="rotate(${a} 30 30)"/>`;
  for (let a = 0; a < 360; a += 45) d += `<circle cx="30" cy="24" r="1.6" transform="rotate(${a} 30 30)"/>`;
  return `<symbol id="${id}" viewBox="0 0 60 60"><g fill="${outer}">${o}</g><g fill="${mid}">${m}</g>`
       + `<circle cx="30" cy="30" r="9.5" fill="${center}"/><g fill="${dot}">${d}</g>`
       + `<circle cx="30" cy="30" r="2.4" fill="${dot}"/></symbol>`;
}
const MARIS = [
  ['mariO', '#f4802a', '#ffb43d', '#e5541f', '#ffe08a'],
  ['mariR', '#e5383b', '#f4666a', '#a81f2c', '#ffd0d0'],
  ['mariY', '#f6a723', '#ffca55', '#e5811f', '#fff0c0'],
  ['mariP', '#ec4f8c', '#f47fae', '#c02766', '#ffd9e8'],
];
const MARI_IDS = MARIS.map(m => m[0]);

// phulkari geometric flower — 8 kite points (tintable) + gold sparks + green/cream diamond core
function phulkariSymbol() {
  let p = '', k = '';
  for (let i = 0; i < 8; i++) p += `<path d="M22 3 L26 20 L22 22 L18 20Z" transform="rotate(${i*45} 22 22)"/>`;
  for (let i = 0; i < 8; i++) k += `<path d="M22 12 L24.5 16 L22 20 L19.5 16Z" transform="rotate(${i*45+22.5} 22 22)"/>`;
  return `<symbol id="phul" viewBox="0 0 44 44"><g fill="currentColor">${p}</g><g fill="var(--gold)">${k}</g>`
       + `<path d="M22 13 L31 22 L22 31 L13 22Z" fill="#2fa36b"/><path d="M22 17 L27 22 L22 27 L17 22Z" fill="#fff3d6"/></symbol>`;
}

const FLOWER = `<symbol id="fl" viewBox="0 0 40 40"><g fill="currentColor">
  <ellipse cx="20" cy="8" rx="5.5" ry="9"/><ellipse cx="20" cy="8" rx="5.5" ry="9" transform="rotate(60 20 20)"/>
  <ellipse cx="20" cy="8" rx="5.5" ry="9" transform="rotate(120 20 20)"/><ellipse cx="20" cy="8" rx="5.5" ry="9" transform="rotate(180 20 20)"/>
  <ellipse cx="20" cy="8" rx="5.5" ry="9" transform="rotate(240 20 20)"/><ellipse cx="20" cy="8" rx="5.5" ry="9" transform="rotate(300 20 20)"/>
  </g><circle cx="20" cy="20" r="5" fill="var(--gold)"/></symbol>`;

const LEAF = `<symbol id="lf" viewBox="0 0 30 20"><path d="M1 10 C8 0 22 0 29 10 C22 20 8 20 1 10Z" fill="var(--green)"/>
  <path d="M4 10 H26" stroke="#4f7d50" stroke-width="1.2" fill="none"/></symbol>`;

function lotusSymbol() {
  const t = 'M45 52 C35 38 39 18 45 6 C51 18 55 38 45 52Z', inner = 'M45 52 C39 42 41 30 45 22 C49 30 51 42 45 52Z';
  let s = '<symbol id="lotus" viewBox="0 0 90 58">';
  [[-52,'#f7a9c6'],[-34,'#f28fb4'],[-17,'#ec6a9c'],[0,'#e0508a'],[17,'#ec6a9c'],[34,'#f28fb4'],[52,'#f7a9c6']]
    .forEach(([a,c]) => s += `<path d="${t}" fill="${c}" transform="rotate(${a} 45 52)"/>`);
  [-22,0,22].forEach(a => s += `<path d="${inner}" fill="#fbd0e0" transform="rotate(${a} 45 52)"/>`);
  return s + '<ellipse cx="45" cy="50" rx="7" ry="4" fill="#f6c343"/></symbol>';
}

const PAISLEY = `<symbol id="paisley" viewBox="0 0 80 120">
  <path d="M46 10 C70 18 74 56 56 84 C44 102 20 106 12 92 C6 81 15 71 27 69 C43 66 52 55 50 40 C49 30 45 22 38 17 C41 13 43 11 46 10Z"
        fill="#fbe2c4" stroke="#c0522a" stroke-width="2.5"/>
  <path d="M44 20 C62 27 65 56 50 79 C41 94 24 97 18 88" fill="none" stroke="#c0522a" stroke-width="1.4" stroke-dasharray="1 5" stroke-linecap="round"/>
  <use href="#mariR" x="30" y="60" width="30" height="30"/>
  <use href="#fl" x="26" y="34" width="16" height="16" style="color:var(--orange)"/>
  <use href="#fl" x="40" y="46" width="13" height="13" style="color:var(--pink)"/></symbol>`;

document.querySelector('#defs defs').innerHTML =
  FLOWER + LEAF + MARIS.map(m => marigoldSymbol(...m)).join('') + phulkariSymbol() + lotusSymbol() + PAISLEY;

// placement helpers
const at = (id, x, y, r, extra = '') => `<use href="#${id}" x="${(x-r/2).toFixed(1)}" y="${(y-r/2).toFixed(1)}" width="${r.toFixed(1)}" height="${r.toFixed(1)}" ${extra}/>`;
const flower = (id, x, y, r) => at(id, x, y, r);
const tinted = (id, x, y, r) => at(id, x, y, r, `style="color:${pick(BRIGHT)}"`);
const spun   = (id, x, y, r) => at(id, x, y, r, `transform="rotate(${ri(0,45)} ${x.toFixed(1)} ${y.toFixed(1)})" style="color:${pick(BRIGHT)}"`);
const leaf   = (x, y, a, w) => `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${a.toFixed(0)})"><use href="#lf" width="${w}" height="${(w*0.66).toFixed(0)}"/></g>`;

// bagh-style field: fill ALL empty space with scattered blooms, skipping the text card
function scatterField(W, H, rect) {
  const pad = 20, step = 60, jit = 20;
  const inCard = (x, y, s) => x > rect.left - pad - s && x < rect.right + pad + s && y > rect.top - pad - s && y < rect.bottom + pad + s;
  let s = '';
  for (let gy = step/2; gy < H + step; gy += step) {
    for (let gx = step/2; gx < W + step; gx += step) {
      const x = gx + rnd(-jit, jit), y = gy + rnd(-jit, jit), sz = rnd(15, 30);
      if (inCard(x, y, sz)) continue;
      const t = Math.random();
      if (t < 0.36)      s += spun('phul', x, y, sz);
      else if (t < 0.62) s += flower(pick(MARI_IDS), x, y, sz);
      else if (t < 0.82) s += tinted('fl', x, y, sz);
      else               s += leaf(x, y, ri(0, 360), ri(18, 26)) + leaf(x + 6, y + 5, ri(0, 360), ri(15, 21));
    }
  }
  return s;
}

// festoon garland — random swag depth, colours, sizes, leaves, hanging danglers
function garland() {
  const W = 1200, amp = rnd(36, 56), base = rnd(6, 14), cy = x => base + amp * Math.sin(Math.PI * x / W);
  let pts = [];
  for (let x = 0; x <= W; x += 20) pts.push(`${x},${cy(x).toFixed(1)}`);
  let s = `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--green)" stroke-width="3"/>`;
  const nLeaf = ri(24, 32);
  for (let i = 0; i <= nLeaf; i++) { const x = i*W/nLeaf; s += leaf(x, cy(x), (i%2 ? -145 : -35) + rnd(-12,12), ri(22,28)); }
  const nFl = ri(16, 20);
  for (let i = 0; i <= nFl; i++) { const x = i*W/nFl + rnd(-10,10); s += flower(pick(MARI_IDS), x, cy(x), rnd(18,26)); }
  const nD = ri(4, 7);
  for (let i = 0; i < nD; i++) {
    const x = rnd(0.07, 0.93)*W, y0 = cy(x), dl = rnd(35, 82), r = rnd(22, 32);
    s += `<line x1="${x.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x.toFixed(1)}" y2="${(y0+dl).toFixed(1)}" stroke="var(--green)" stroke-width="2.2"/>`;
    s += `<g transform="translate(${x.toFixed(1)} ${(y0+dl*0.55).toFixed(1)}) rotate(-90)"><use href="#lf" width="22" height="14"/></g>`;
    s += (Math.random() < 0.5 ? spun('phul', x, y0+dl, r) : flower(pick(MARI_IDS), x, y0+dl, r));
  }
  return s;
}

// vertical side spray: paisley + random marigolds, phulkari and leaves
function side() {
  let s = '<path d="M18 0 C22 60 30 110 26 150 C22 190 34 230 60 258" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round"/>';
  [[30,40,30],[24,120,60],[34,200,30]].forEach(([x,y,a]) => s += leaf(x, y, a + rnd(-10,10), ri(26,30)));
  s += flower(pick(MARI_IDS), 25, 27, rnd(38,46));
  s += spun('phul', 50, 52, rnd(26,32));
  s += '<use href="#paisley" x="14" y="86" width="74" height="110"/>';
  s += flower(pick(MARI_IDS), 22, 196, rnd(36,42));
  s += spun('phul', 47, 220, rnd(24,30));
  s += tinted('fl', 52, 150, 18);
  return s;
}

// divider under the names: two marigolds flanking a lotus
function divider() {
  let s = '<path d="M20 40 Q90 60 160 40" fill="none" stroke="var(--green)" stroke-width="2"/>';
  s += leaf(24, 26, -20 + rnd(-8,8), 26);
  s += `<g transform="translate(150 26) rotate(${(20+rnd(-8,8)).toFixed(0)}) scale(-1,1)"><use href="#lf" width="26" height="17"/></g>`;
  s += flower(pick(MARI_IDS), 47, 31, 26);
  s += flower(pick(MARI_IDS), 133, 31, 26);
  s += '<use href="#lotus" x="60" y="2" width="60" height="40"/>';
  return s;
}

// paint the background field to fill empty space around the (measured) card
function paintField() {
  const f = document.querySelector('.field'), fr = f.getBoundingClientRect();
  const W = Math.round(fr.width) || window.innerWidth || 1200, H = Math.round(fr.height) || window.innerHeight || 800;
  f.setAttribute('viewBox', `0 0 ${W} ${H}`);
  f.innerHTML = scatterField(W, H, document.querySelector('.card').getBoundingClientRect());
}

document.querySelector('.garland.top').innerHTML = garland();
document.querySelector('.garland.bottom').innerHTML = garland();
document.querySelector('.side.left').innerHTML = side();
document.querySelector('.side.right').innerHTML = side();
document.querySelector('.sprig').innerHTML = divider();
paintField();

// keep the field filling space if the window is resized (debounced)
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(paintField, 200); });

// ponytail: sanity check the generators actually produced blooms
console.assert(document.querySelectorAll('.garland.top use').length > 8 && document.querySelectorAll('.field use').length > 20,
  'floral generator produced too few blooms');
</script>
</body>
</html>
