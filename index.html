<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ===== EDIT THESE ===== -->
<title>Save the Date</title>
<meta property="og:title" content="Save the Date — Ridhiman & Vijit">
<meta property="og:description" content="We're getting married! February 27, 2027.">
<meta name="theme-color" content="#e0662a">
<style>
  :root{
    /* EDIT: colors */
    --ink:#6d2b3d;      /* deep rose — names & text */
    --accent:#e0662a;   /* orange — eyebrow, button */
    --muted:#c94f7c;    /* pink — location */
    --pink:#ec4f8c; --red:#e5383b; --orange:#f4802a; --gold:#f6c343; --green:#6aa06b;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:linear-gradient(160deg,#fff2e6 0%,#ffe9ef 55%,#ffe3ea 100%);
    color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    display:grid; place-items:center; min-height:100dvh; padding:2rem; text-align:center;
    -webkit-font-smoothing:antialiased;
  }
  .card{max-width:34rem; animation:rise .9s ease both; position:relative; z-index:1}
  @keyframes rise{from{opacity:0; transform:translateY(12px)}to{opacity:1}}
  .eyebrow{letter-spacing:.35em; text-transform:uppercase; font-size:.72rem; color:var(--accent)}
  .names{font-size:clamp(2.6rem,9vw,4.5rem); line-height:1.05; margin:1.2rem 0; color:var(--ink)}
  .amp{display:block; font-style:italic; font-size:.5em; color:var(--accent); margin:.15em 0}
  .line{font-size:1.15rem; margin:.4rem 0}
  .date{font-size:1.5rem; letter-spacing:.02em}
  .muted{color:var(--muted)}
  .cta{
    display:inline-block; margin-top:2rem; padding:.8rem 1.6rem;
    border:1px solid var(--accent); border-radius:2rem; color:var(--accent);
    text-decoration:none; letter-spacing:.12em; text-transform:uppercase; font-size:.75rem;
    transition:background .2s,color .2s;
  }
  .cta:hover{background:var(--accent); color:#fff}
  /* floral corners */
  .floral{position:fixed; width:min(34vw,230px); aspect-ratio:1; opacity:.95; pointer-events:none}
  .tl{top:0; left:0}
  .tr{top:0; right:0; transform:scaleX(-1)}
  .bl{bottom:0; left:0; transform:scaleY(-1)}
  .br{bottom:0; right:0; transform:scale(-1)}
  .sprig{width:150px; aspect-ratio:2.7; margin:.4rem auto 0; display:block}
  /* short viewports (landscape phones): florals would collide with centered text */
  @media (max-height:520px){
    .floral{display:none}
    body{place-items:start center; padding-block:1.5rem}
    .names{font-size:clamp(2rem,7vw,3rem); margin:.6rem 0}
  }
</style>
</head>
<body>
  <!-- reusable flower + leaf, composed into one colorful spray, reused in 4 corners -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="fl" viewBox="0 0 40 40">
      <g fill="currentColor">
        <ellipse cx="20" cy="8" rx="5.5" ry="9"/>
        <ellipse cx="20" cy="8" rx="5.5" ry="9" transform="rotate(60 20 20)"/>
        <ellipse cx="20" cy="8" rx="5.5" ry="9" transform="rotate(120 20 20)"/>
        <ellipse cx="20" cy="8" rx="5.5" ry="9" transform="rotate(180 20 20)"/>
        <ellipse cx="20" cy="8" rx="5.5" ry="9" transform="rotate(240 20 20)"/>
        <ellipse cx="20" cy="8" rx="5.5" ry="9" transform="rotate(300 20 20)"/>
      </g>
      <circle cx="20" cy="20" r="5" fill="var(--gold)"/>
    </symbol>
    <symbol id="lf" viewBox="0 0 30 20">
      <path d="M1 10 C8 0 22 0 29 10 C22 20 8 20 1 10Z" fill="var(--green)"/>
      <path d="M4 10 H26" stroke="#4f7d50" stroke-width="1.2" fill="none"/>
    </symbol>

    <symbol id="spray" viewBox="0 0 200 200">
      <path d="M6 6 C50 26 84 54 108 104 C124 138 152 162 194 190" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round"/>
      <!-- leaves -->
      <g transform="translate(30 24) rotate(-35)"><use href="#lf" width="30" height="20"/></g>
      <g transform="translate(60 30) rotate(-72)"><use href="#lf" width="26" height="17"/></g>
      <g transform="translate(96 78) rotate(-40)"><use href="#lf" width="26" height="17"/></g>
      <g transform="translate(150 150) rotate(-35)"><use href="#lf" width="30" height="20"/></g>
      <g transform="translate(128 170) rotate(-72)"><use href="#lf" width="24" height="16"/></g>
      <!-- corner bloom cluster -->
      <use href="#fl" x="40" y="-2" width="18" height="18" style="color:var(--orange)"/>
      <use href="#fl" x="0" y="0" width="42" height="42" style="color:var(--pink)"/>
      <use href="#fl" x="32" y="12" width="30" height="30" style="color:var(--orange)"/>
      <use href="#fl" x="10" y="32" width="28" height="28" style="color:var(--red)"/>
      <!-- trailing bloom cluster -->
      <use href="#fl" x="148" y="150" width="36" height="36" style="color:var(--pink)"/>
      <use href="#fl" x="132" y="170" width="24" height="24" style="color:var(--orange)"/>
      <use href="#fl" x="168" y="138" width="24" height="24" style="color:var(--red)"/>
    </symbol>

    <symbol id="sprigc" viewBox="0 0 120 44">
      <path d="M20 30 Q60 46 100 30" fill="none" stroke="var(--green)" stroke-width="2"/>
      <g transform="translate(16 16) rotate(-18)"><use href="#lf" width="26" height="17"/></g>
      <g transform="translate(78 16) rotate(18) scale(-1,1)"><use href="#lf" width="26" height="17"/></g>
      <use href="#fl" x="30" y="16" width="18" height="18" style="color:var(--orange)"/>
      <use href="#fl" x="72" y="16" width="18" height="18" style="color:var(--red)"/>
      <use href="#fl" x="46" y="0" width="30" height="30" style="color:var(--pink)"/>
    </symbol>
  </defs></svg>

  <svg class="floral tl" aria-hidden="true"><use href="#spray"/></svg>
  <svg class="floral tr" aria-hidden="true"><use href="#spray"/></svg>
  <svg class="floral bl" aria-hidden="true"><use href="#spray"/></svg>
  <svg class="floral br" aria-hidden="true"><use href="#spray"/></svg>

  <main class="card">
    <p class="eyebrow">Save the Date</p>
    <!-- EDIT: names -->
    <h1 class="names">Ridhiman<span class="amp">and</span>Vijit</h1>
    <svg class="sprig" aria-hidden="true"><use href="#sprigc"/></svg>
    <!-- EDIT: date + place -->
    <p class="line date">Saturday, February 27, 2027</p>
    <p class="line muted">Panchkula, Haryana</p>
    <p class="line">Formal invitation to follow</p>

    <!-- EDIT the calendar link's dates (YYYYMMDD) & details -->
    <a class="cta" target="_blank" rel="noopener"
       href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Ridhiman%20%26%20Vijit%27s%20Wedding&dates=20270227/20270228&details=Save%20the%20date%21%20Formal%20invitation%20to%20follow.&location=Panchkula%2C%20Haryana">
      Add to calendar
    </a>
  </main>
</body>
</html>
